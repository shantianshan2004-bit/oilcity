<!DOCTYPE html>

<body data-page="music">

<div class="ink-field" id="inkMusic"></div>

<div class="page">
  <header class="masthead">
    <div class="shell">
      <a class="brand" href="index.html">油城往事<span class="en">Oil City Archives</span></a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav">目 錄</button>
      <nav class="nav" id="mainNav">
        <a href="chapters.html">故事</a>
        <a href="characters.html">人物</a>

        <a href="cocreate.html">共创档案</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="music-hero shell">
      <p class="label develop">Gramophone · <span id="songCount">—</span> Songs</p>
      <h1 class="title-lg develop" data-delay="1">油城<br>留声机</h1>
      <p class="hero-sub develop" data-delay="2" style="max-width:36ch;color:#8B877D">
        灯昏下来，唱片还在转。有人唱台上，有人唱命里。
      </p>
    </section>

    <section class="shell" style="padding-bottom:var(--space-6)">
      <ul class="song-list" id="songList"></ul>
    </section>

    <!-- ============ 投稿：音频 / 封面 / 歌词 ============ -->
    <section class="shell" id="musicUpload" style="padding-bottom:var(--space-7)">
      <div class="section-head reveal">
        <p class="label">Contribute</p>
        <h2 class="section-title" style="font-size:1.6rem">投稿到留声机</h2>
        <div class="rule-ink" aria-hidden="true"></div>
        <p class="notice">
          音訊、封面与歌词都从这里提交。登录后可直接上传，
          保存即同步给所有读者，旧稿自动留档。
        </p>
      </div>
      <div id="songUpload"></div>
    </section>
  </main>

  <footer class="colophon">
    <div class="shell">
      <p>油城往事 · 词曲取自原文，可投稿。</p>
      <p class="en">Oil City Archives — a co-created literary archive</p>
      <p class="micro" id="storageNote"></p>
    </div>
  </footer>
</div>

<script src="js/seed.js"></script>
<script src="js/ink-engine.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  (async function () {
    document.getElementById("inkMusic").innerHTML = InkEngine.PRESETS.music();
    InkEngine.initParallax();
    await Store.init();
    App.mountChrome();
    App.musicPage();
    InkEngine.initReveal();
  })();
</script>
