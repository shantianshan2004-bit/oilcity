<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>油城往事 · 云端连线自检</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#EAE8E1;color:#171715;
     margin:0;padding:2rem;line-height:1.7;font-size:14px}
h1{font-size:1.1rem;letter-spacing:.2em;font-weight:500}
#out{white-space:pre-wrap;word-break:break-all}
.ok{color:#2e7d32}.bad{color:#873D32}.dim{color:#77766F}
</style></head><body>
<h1>云端连线自检 · OIL CITY ARCHIVES</h1>
<div id="out">检测中…</div>
<script>
const out=document.getElementById("out");
const log=(s,cls)=>{out.innerHTML+=`\n<span class="${cls||""}">${s}</span>`};
out.innerHTML="";
log("origin          : "+location.origin);
log("href            : "+location.href);
log("SDK             : @tencent-ai/workbuddy-cloud-sdk");
log("");
const CFG={resourceId:"wbcs_D7mSSSmSnPaodlPlrkZMV3",
  endpoint:"https://oil-city-archives.app.workbuddy.host",
  oauthRelayBaseUrl:"https://www.workbuddy.cn/v2/as/genie-baas/oauth",
  publishableKey:"wbpk_bjjEnYmR3bnbqIkReGnes3_80zIbtLkjorx8eAhy46WDGMRMtaQO6ky"};
function load(src){return new Promise((res,rej)=>{const s=document.createElement("script");
  s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error("script load failed"));
  document.head.appendChild(s);});}
(async()=>{
try{
  await load("https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js");
  log("1. SDK 载入        : 成功","ok");
}catch(e){log("1. SDK 载入        : 失败 — "+e.message,"bad");return;}
try{
  log("2. window.WorkBuddyCloud keys : "+Object.keys(window.WorkBuddyCloud||{}).join(", "),"dim");
  const ns=window.WorkBuddyCloud||{};
  const f= typeof ns.createWorkBuddyCloud==="function" ? ns.createWorkBuddyCloud
         : typeof ns.createClient==="function" ? ns.createClient
         : typeof ns==="function" ? ns : null;
  log("3. factory           : "+(f? f.name||"(anonymous)" : "找不到！"),"dim");
  if(!f) throw new Error("SDK 沒有可用的工廠函數");
  const cloud=await f(CFG);
  log("4. createClient      : 成功","ok");
  log("   客户端属性         : "+Object.keys(cloud).join(", "),"dim");
  const dbm=cloud.database||cloud.db;
  log("   数据库模块         : "+(dbm?"cloud."+(cloud.database?"database":"db"):"找不到！"),"dim");
  try{
    const s=await cloud.auth.getSession();
    /* SDK 返回 {data,error} 包装对象，本身永真——必须看 data */
    const sess=s&&s.data;
    log("5. auth.getSession   : "+(sess?("有会话 — "+(sess.user&&(sess.user.email||sess.user.id)||sess.accessToken.slice(0,8))):"未登录（data 为 null，属正常）"), sess?"ok":"dim");
  }catch(e){log("5. auth.getSession   : 抛错 — "+(e&&e.message||e),"bad");}
  if(!dbm){log("6. db 读取 contents   : 跳过（无数据库模块）","bad");}
  else try{
    const r=await dbm.from("contents").select("*").limit(1);
    if(r&&r.error) log("6. db 读取 contents   : 拒绝 — "+r.error.message,"bad");
    else log("6. db 读取 contents   : 成功，返回 "+((r&&r.data||[]).length)+" 行","ok");
  }catch(e){log("6. db 读取 contents   : 抛错 — "+(e&&e.message||e),"bad");}

  /* ---- 7. 登录态持久化 ---- */
  log("");
  log("——— 登录态持久化检查 ———","dim");
  const SESSION_KEY="workbuddy-cloud.session."+CFG.publishableKey;
  let lsRaw=null;
  try{ lsRaw=localStorage.getItem(SESSION_KEY); }catch(e){}
  log("7. localStorage 键名 : "+(lsRaw?"已存在":"（无，尚未登录过）"), lsRaw?"ok":"dim");
  const peeked=(cloud.auth.sessions&&cloud.auth.sessions.peek)?cloud.auth.sessions.peek():null;
  if(peeked&&peeked.accessToken){
    log("8. 持久化会话可读回  : 是 — "+(peeked.user&&(peeked.user.email||peeked.user.id)||"已登录"),"ok");
    log("   令牌过期时间       : "+new Date(peeked.expiresAt).toLocaleString(),"dim");
    log("   → 刷新页面应保持登录","ok");
  }else{
    log("8. 持久化会话可读回  : 无（未登录，属正常）","dim");
  }
  if(typeof cloud.auth.onAuthStateChange==="function"){
    log("9. 事件订阅可用      : 是（INITIAL_SESSION / SIGNED_IN / SIGNED_OUT）","ok");
  }else{
    log("9. 事件订阅可用      : 否","bad");
  }

  /* ---- 10. 验证码链路自检（不发真实邮件，只验证 SDK 形状） ---- */
  log("");
  log("——— 验证码登录链路 ———","dim");
  log("10. signInWithOtp    : "+(typeof cloud.auth.signInWithOtp==="function"?"可用":"缺失"),"dim");
  log("    verifyOtp        : "+(typeof cloud.auth.verifyOtp==="function"?"可用":"缺失"),"dim");
  log("    getUser          : "+(typeof cloud.auth.getUser==="function"?"可用":"缺失"),"dim");
  log("    说明：点「寄送验证码」后应看到 POST /v1/verification，","dim");
  log("          提交验证码时应看到 /v1/verification/verify → /v1/signin。","dim");
  if(peeked&&peeked.accessToken){
    try{
      const g=await cloud.auth.getUser();
      log("11. getUser()        : "+(g&&g.data&&g.data.email?("邮箱 "+g.data.email):"未返回邮箱"), (g&&g.data&&g.data.email)?"ok":"dim");
    }catch(e){ log("11. getUser()        : 抛错 — "+(e&&e.message||e),"bad"); }
  }

  /* ---- 12. 存储链路自检（留声机投稿用） ---- */
  log("");
  log("——— 存储桶链路（音频/封面投稿）———","dim");
  const st=cloud.storage;
  log("12. storage.from     : "+(typeof st.from==="function"?"可用":"缺失"),"dim");
  try{
    st.from("media");
    log("13. from('media')    : 通过（不该通过，SDK 已放宽？）","bad");
  }catch(e){
    log("13. from('media')    : 被拒 → "+e.message,"dim");
  }
  let bucket=null;
  try{
    bucket=st.from();
    log("14. from() 默认桶    : 通过（正确用法，桶名固定为 runtime）","ok");
  }catch(e){
    log("14. from() 默认桶    : 被拒 → "+e.message,"bad");
  }
  log("15. userPath/sharedPath: "+((typeof st.userPath==="function"?"userPath ":"")+(typeof st.sharedPath==="function"?"sharedPath":"")||"缺失")+" 可用","dim");
  if(bucket){
    if(peeked&&peeked.accessToken&&peeked.user&&peeked.user.id){
      log("16. 上传路径          : "+st.userPath(peeked.user.id,"<时间戳>-<文件名>"),"dim");
    }else{
      log("16. 上传路径          : 登录后为 users/<uid>/…，未登录投稿不可用","dim");
    }
    log("    → 上传请求应为 POST /storage/object/runtime/…","dim");
  }
}catch(e){
  log("4. createClient    : 失败 — "+(e&&e.message||e),"bad");
  log("");
  log("→ 若此处失败，即说明云端以 Origin 白名单拒绝了本域名。","bad");
}
log("");
log("自检结束。请把以上全部内容截图发我。");
})();
</script></body></html>
